[package]
name = "web-avenger"
version = "0.1.0"
edition = "2024"
description = "Agregador standalone de jogos WebAssembly com Chromium embutido (CEF)"
publish = false

[dependencies]
cef = "156.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Decodifica AAC (MP4), que o CEF não traz por ser codec proprietário.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
# Integração com o itch.io: chave do token no chaveiro do sistema (Secret Service),
# token cifrado com ChaCha20-Poly1305 e PKCE (SHA-256 + base64url) no OAuth.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
