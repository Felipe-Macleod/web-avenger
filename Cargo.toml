[package]
name = "web-avenger"
version = "0.1.0"
edition = "2024"
description = "Agregador standalone de jogos WebAssembly com Chromium embutido (CEF)"
publish = false

[dependencies]
cef = "156.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Decodifica AAC (MP4), que o CEF não traz por ser codec proprietário.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
# Integração com o itch.io: token cifrado com ChaCha20-Poly1305 e PKCE
# (SHA-256 + base64url) no OAuth. A chave do token fica no chaveiro do sistema (`keyring`, abaixo).
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
# Bloqueio de anúncios nas janelas de jogo (motor do Brave, listas EasyList/EasyPrivacy).
# Sem a feature padrão `single-thread`: o motor é consultado na thread de IO do CEF.
adblock = { version = "0.13", default-features = false, features = ["addr", "embedded-domain-resolver", "full-regex-handling"] }

# Chaveiro do sistema: Secret Service no Linux, Credential Manager no Windows.
# (Sem a feature da plataforma o `keyring` usa um armazenamento só em memória.)
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

# Manifesto do .exe (compatibilidade com Windows 10+, exigida pelo CEF).
[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"

[profile.release]
strip = true
lto = "thin"
